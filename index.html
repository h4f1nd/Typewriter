<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typewriter &mdash; a quiet typing room</title>
  <meta name="description" content="A tiny retro typewriter you can type on. No accounts, no tracking, no uploads. Everything stays in your browser.">
  <meta name="theme-color" content="#241c16">
  <meta property="og:title" content="Typewriter">
  <meta property="og:description" content="A tiny retro typing room. Nothing is saved, nothing is sent.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f2e8d2'/%3E%3Crect x='6' y='9' width='20' height='14' rx='1' fill='none' stroke='%23241f1a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23a63d2f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#paper">Skip to the typing area</a>

  <main class="stage">
    <article class="sheet">
      <header class="sheet-head">
        <span class="brand">Typewriter</span>
        <span class="plate">Model&nbsp;01 &middot; No.&nbsp;0001</span>
      </header>

      <h1 class="hero" id="headline">
        <span class="sr-only">Words, one key at a time.</span>
        <span class="typed" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span>
      </h1>

      <p class="lede">
        A quiet place to type. Nothing is saved, nothing is sent &mdash;
        close the tab and it&rsquo;s gone.
      </p>

      <div class="pad">
        <label class="sr-only" for="paper">Typing area</label>
        <textarea
          id="paper"
          class="paper"
          rows="5"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="sentences"
          placeholder="Start typing&hellip;"
        ></textarea>
      </div>

      <div class="controls">
        <button class="key" id="new-sheet" type="button">New sheet</button>
        <button class="key" id="sound" type="button" aria-pressed="false">Sound: off</button>
        <p class="meter"><span id="count">000</span> keys</p>
      </div>

      <p class="sr-only" id="status" role="status"></p>

      <footer class="sheet-foot">
        <span>vanilla html / css / js</span>
        <span>no data leaves this page</span>
      </footer>
    </article>
  </main>

  <script src="app.js"></script>
</body>
</html>
